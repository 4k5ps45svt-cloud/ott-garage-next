<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101a2b"><title>OTM Garage NEXT · Demo</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172338;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}header{background:#101a2b;color:white;padding:20px 18px 18px}header small{color:#aebbd0}header h1{margin:5px 0;font-size:24px}.shell{max-width:1100px;margin:auto}.layout{display:grid;grid-template-columns:215px 1fr;min-height:calc(100vh - 90px)}nav{background:white;border-right:1px solid #dce4ee;padding:15px;display:flex;flex-direction:column;gap:7px}nav button{border:0;text-align:left;background:transparent;padding:13px;border-radius:10px;color:#27364c}nav button.active{background:#e8f0ff;color:#1755b6;font-weight:700}main{padding:22px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h2{margin:0 0 15px;font-size:23px}h3{margin:0 0 12px}.btn{background:#1761cb;color:white;border:0;border-radius:10px;padding:11px 14px;font-weight:650}.secondary{background:white;color:#193657;border:1px solid #cbd8e8}.danger{background:#b32338}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:15px 0}.card,.panel{background:white;border:1px solid #e0e7f0;border-radius:15px;padding:17px}.card strong{display:block;font-size:29px;margin-top:7px}.muted{color:#64758d;font-size:13px}.panel{margin:14px 0;overflow-x:auto}.item{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid #eef1f6;padding:13px 0}.item:last-child{border-bottom:0}.pill{border-radius:30px;background:#e9f2ff;color:#235caa;padding:5px 9px;font-size:12px}.actions{display:flex;gap:7px;flex-wrap:wrap}label{display:block;font-size:13px;font-weight:650;margin:10px 0 5px}input,select,textarea{width:100%;padding:11px;border:1px solid #c9d5e4;border-radius:9px;background:white}textarea{min-height:70px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}.span2{grid-column:span 2}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.empty{padding:20px;color:#65758a}.line{display:grid;grid-template-columns:2fr 70px 105px 36px;gap:7px;margin:8px 0}.line input{min-width:0}.banner{background:#fff4db;color:#75500d;padding:11px 16px;font-size:13px}.onlyprint{display:none}#printArea{display:none}@media(max-width:760px){.layout{display:block}nav{display:flex;flex-direction:row;overflow:auto;position:sticky;top:0;z-index:4;border-bottom:1px solid #ddd;padding:7px;gap:4px}nav button{white-space:nowrap;padding:10px}main{padding:14px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.formgrid{grid-template-columns:1fr}.span2{grid-column:span 1}.item{align-items:flex-start}.line{grid-template-columns:1fr 55px 76px 30px}}@media print{@page{size:A4 portrait;margin:14mm}body{background:white}header,nav,main,.banner{display:none!important}#printArea{display:block!important;font-size:12pt;color:#111}#printArea h1{font-size:23pt}#printArea table{width:100%;border-collapse:collapse}#printArea td,#printArea th{padding:8px;border-bottom:1px solid #ccc;text-align:left}}
</style></head><body><header><div class="shell"><small>PROTOTIPO INDIPENDENTE · 0.1 DEMO</small><h1>OTM Garage <span style="color:#69b4ff">NEXT</span></h1><small>Il gestionale per la tua officina</small></div></header><div class="banner">Versione dimostrativa: dati salvati solo in questo browser, senza cifratura né sincronizzazione. Non inserire dati reali dei clienti.</div><div class="shell layout"><nav id="nav"></nav><main id="app"></main></div><div id="printArea"></div>
<script>
'use strict';
const KEY='otm_next_demo_v01';
const demo={clients:[{id:'c1',name:'Cliente Demo',phone:'',plate:'ZH 123456',vehicle:'VW Golf'}],appointments:[{id:'a1',clientId:'c1',date:'2026-10-28',time:'09:00',desc:'Service annuale',jobId:null,quoteId:null}],quotes:[],jobs:[],invoices:[]};
let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(demo)}catch(e){db=JSON.parse(JSON.stringify(demo))}
let page='home',edit=null,lines=[];
const $=id=>document.getElementById(id), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=x=>x?x.split('-').reverse().join('.'):'—',uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36),client=id=>db.clients.find(c=>c.id===id),fmt=x=>new Intl.NumberFormat('it-CH',{style:'currency',currency:'CHF'}).format(Number(x)||0);
function save(){localStorage.setItem(KEY,JSON.stringify(db))}function go(p){page=p;edit=null;render()}function btn(label,fn,cls='secondary'){return `<button class="btn ${cls}" onclick="${fn}">${label}</button>`}
const sections=[['home','⌂ Home'],['agenda','▦ Agenda'],['clients','♙ Clienti'],['quotes','▤ Preventivi'],['jobs','⚒ Lavori'],['invoices','▣ Fatture']];
function render(){ $('nav').innerHTML=sections.map(([k,n])=>`<button class="${page===k?'active':''}" onclick="go('${k}')">${n}</button>`).join(''); const a=$('app');a.innerHTML=edit?form():page==='home'?home():list(); }
function home(){let upcoming=db.appointments.filter(x=>!x.jobId).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,5);return `<div class="top"><h2>Panoramica officina</h2>${btn('+ Appuntamento',"start('appointment')",'')}</div><div class="cards">${[['Appuntamenti',db.appointments.length,'agenda'],['Preventivi',db.quotes.length,'quotes'],['Lavori',db.jobs.length,'jobs'],['Fatture',db.invoices.length,'invoices']].map(([n,v,p])=>`<div class="card" onclick="go('${p}')" style="cursor:pointer"><span class="muted">${n}</span><strong>${v}</strong></div>`).join('')}</div><div class="panel"><h3>Prossimi appuntamenti</h3>${upcoming.length?upcoming.map(x=>`<div class="item"><div><b>${esc(client(x.clientId)?.name||'Cliente')}</b><div class="muted">${date(x.date)} · ${esc(x.time)} · ${esc(x.desc)}</div></div>${btn('Apri',`openItem('appointment','${x.id}')`)}</div>`).join(''):'<p class="empty">Nessun appuntamento in attesa.</p>'}</div><div class="panel"><h3>Accesso rapido</h3><div class="row">${btn('+ Preventivo',"start('quote')",'')}${btn('+ Cliente',"start('client')")}${btn('Agenda',"go('agenda')")}</div></div>`}
function list(){const config={agenda:['Appuntamenti','appointment','appointments'],clients:['Clienti e veicoli','client','clients'],quotes:['Preventivi','quote','quotes'],jobs:['Schede lavoro','job','jobs'],invoices:['Fatture','invoice','invoices']}[page];let [title,type,key]=config;let arr=db[key].slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));return `<div class="top"><h2>${title}</h2>${type==='job'||type==='invoice'?'':btn('+ Nuovo',`start('${type}')`,'')}</div><div class="panel">${arr.length?arr.map(x=>`<div class="item"><div><b>${esc(client(x.clientId)?.name||x.name||'Cliente')}</b><div class="muted">${date(x.date)} ${esc(x.time||'')} · ${esc(x.desc||x.vehicle||'')} ${x.total!==undefined?'· '+fmt(x.total):''}</div><div style="margin-top:6px"><span class="pill">${esc(x.status||title.slice(0,-1))}</span></div></div><div class="actions">${btn('Apri',`openItem('${type}','${x.id}')`)}${type==='appointment'&&!x.jobId?btn('Avvia lavoro',`startJob('${x.id}')`,''):''}${type==='quote'&&!x.appointmentId?btn('Conferma e prenota',`bookQuote('${x.id}')`,''):''}${type==='job'&&!x.invoiceId?btn('Crea fattura',`makeInvoice('${x.id}')`,''):''}</div></div>`).join(''):'<p class="empty">Nessun elemento presente.</p>'}</div>`}
function start(type){edit={type,id:null};lines=[{name:'',qty:'',price:''}];render()}
function openItem(type,id){let map={appointment:'appointments',client:'clients',quote:'quotes',job:'jobs',invoice:'invoices'};let x=db[map[type]].find(x=>x.id===id);if(!x)return;edit={type,id};lines=(x.lines||[]).map(l=>({...l}));if(!lines.length)lines=[{name:'',qty:'',price:''}];render()}
function opts(selected){return `<option value="">Seleziona cliente</option>`+db.clients.map(c=>`<option value="${esc(c.id)}" ${selected===c.id?'selected':''}>${esc(c.name)} · ${esc(c.vehicle)}</option>`).join('')}
function field(label,name,value='',type='text',more=''){return `<div ${more}><label for="f_${name}">${label}</label><input id="f_${name}" type="${type}" value="${esc(value)}"></div>`}
function form(){let {type,id}=edit;let map={appointment:'appointments',client:'clients',quote:'quotes',job:'jobs',invoice:'invoices'},x=db[map[type]].find(z=>z.id===id)||{};let title={appointment:'Appuntamento',client:'Cliente',quote:'Preventivo',job:'Scheda lavoro',invoice:'Fattura'}[type];let body=type==='client'?`<div class="formgrid">${field('Nome','name',x.name)}${field('Telefono','phone',x.phone)}${field('Targa','plate',x.plate)}${field('Veicolo','vehicle',x.vehicle)}</div>`:`<div class="formgrid"><div><label>Cliente</label><select id="f_clientId">${opts(x.clientId)}</select></div>${field('Data','date',x.date||new Date().toISOString().slice(0,10),'date')}${type==='appointment'?field('Orario','time',x.time||'09:00','time'):''}${field('Descrizione / intervento','desc',x.desc||'','text','class="span2"')}</div>${['quote','job','invoice'].includes(type)?`<h3 style="margin-top:20px">Materiali e manodopera</h3><p class="muted">Aggiungi ogni voce con quantità e prezzo unitario in CHF.</p><div id="lines">${lineHtml()}</div><div class="row">${btn('+ Voce',"addLine()")}</div><p><b>Totale: <span id="total">${fmt(calc())}</span></b></p>`:''}`;
return `<div class="top"><h2>${id?'Modifica':'Nuovo'} ${title.toLowerCase()}</h2>${btn('← Indietro',`go('${type==='appointment'?'agenda':map[type]}')`)}</div><div class="panel"><form onsubmit="submitForm(event)">${body}<div class="row"><button class="btn" type="submit">Salva ${title.toLowerCase()}</button>${id&&['quote','job','invoice'].includes(type)?btn('Stampa / PDF',`printDoc('${type}','${id}')`):''}${id&&type==='quote'&&!x.appointmentId?btn('Conferma e prenota',`bookQuote('${id}')`):''}${id&&type==='appointment'&&!x.jobId?btn('Avvia lavoro',`startJob('${id}')`):''}</div></form></div>`}
function lineHtml(){return lines.map((l,i)=>`<div class="line"><input aria-label="Voce" placeholder="Materiale o manodopera" value="${esc(l.name)}" oninput="lineSet(${i},'name',this.value)"><input aria-label="Quantità" type="number" min="0" step=".01" placeholder="Qtà" value="${esc(l.qty)}" oninput="lineSet(${i},'qty',this.value)"><input aria-label="Prezzo unitario" type="number" min="0" step=".01" placeholder="CHF" value="${esc(l.price)}" oninput="lineSet(${i},'price',this.value)"><button type="button" onclick="removeLine(${i})">×</button></div>`).join('')}
function lineSet(i,k,v){lines[i][k]=v;$('total').textContent=fmt(calc())}function calc(){return lines.reduce((s,l)=>s+(Number(l.qty)||0)*(Number(l.price)||0),0)}function addLine(){lines.push({name:'',qty:'',price:''});$('lines').innerHTML=lineHtml()}function removeLine(i){lines.splice(i,1);$('lines').innerHTML=lineHtml();$('total').textContent=fmt(calc())}
function submitForm(e){e.preventDefault();let {type,id}=edit,map={appointment:'appointments',client:'clients',quote:'quotes',job:'jobs',invoice:'invoices'},key=map[type],arr=db[key],old=arr.find(x=>x.id===id)||{},x={...old,id:id||uid()};let names=type==='client'?['name','phone','plate','vehicle']:['clientId','date','desc',...(type==='appointment'?['time']:[])];for(let n of names)x[n]=$('f_'+n).value;if(type!=='client'&&!x.clientId){alert('Seleziona un cliente.');return}if(type==='client'&&!x.name.trim()){alert('Inserisci il nome.');return}if(['quote','job','invoice'].includes(type)){x.lines=lines.filter(l=>l.name.trim()).map(l=>({name:l.name,qty:Number(l.qty)||0,price:Number(l.price)||0}));x.total=calc()}if(!id){x.status=type==='appointment'?'Prenotato':type==='quote'?'Bozza':type==='job'?'In lavorazione':type==='invoice'?'Da pagare':'';arr.push(x)}save();go(type==='appointment'?'agenda':key)}
function bookQuote(id){let q=db.quotes.find(x=>x.id===id);if(!q)return;if(q.appointmentId){go('agenda');return}let d=prompt('Data appuntamento (AAAA-MM-GG)',new Date().toISOString().slice(0,10));if(!d)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){alert('Data non valida');return}let t=prompt('Ora appuntamento (HH:MM)','09:00');if(!t)return;if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(t)){alert('Orario non valido');return}let a={id:uid(),clientId:q.clientId,date:d,time:t,desc:q.desc,quoteId:q.id,jobId:null,status:'Prenotato'};db.appointments.push(a);q.appointmentId=a.id;q.status='Confermato';save();go('agenda')}
function startJob(id){let a=db.appointments.find(x=>x.id===id);if(!a)return;if(a.jobId){openItem('job',a.jobId);return}let q=db.quotes.find(x=>x.id===a.quoteId);let j={id:uid(),clientId:a.clientId,date:a.date,desc:a.desc,appointmentId:a.id,quoteId:a.quoteId||null,lines:q?.lines?.map(l=>({...l}))||[],total:q?.total||0,status:'In lavorazione'};db.jobs.push(j);a.jobId=j.id;save();openItem('job',j.id)}
function makeInvoice(id){let j=db.jobs.find(x=>x.id===id);if(!j)return;if(j.invoiceId){openItem('invoice',j.invoiceId);return}let v={id:uid(),clientId:j.clientId,date:new Date().toISOString().slice(0,10),desc:j.desc,jobId:j.id,lines:(j.lines||[]).map(l=>({...l})),total:j.total,status:'Da pagare'};db.invoices.push(v);j.invoiceId=v.id;j.status='Completato';save();openItem('invoice',v.id)}
function printDoc(type,id){let arr=db[{quote:'quotes',job:'jobs',invoice:'invoices'}[type]],x=arr.find(z=>z.id===id);if(!x)return;let c=client(x.clientId)||{};let title={quote:'PREVENTIVO',job:'SCHEDA LAVORO',invoice:'FATTURA'}[type];$('printArea').innerHTML=`<h1>OTM GARAGE NEXT</h1><h2>${title}</h2><p>Data: ${date(x.date)}<br>Cliente: ${esc(c.name)}<br>Veicolo: ${esc(c.vehicle)} · ${esc(c.plate)}</p><p>${esc(x.desc)}</p><table><thead><tr><th>Descrizione</th><th>Qtà</th><th>CHF/unità</th><th>Totale</th></tr></thead><tbody>${(x.lines||[]).map(l=>`<tr><td>${esc(l.name)}</td><td>${esc(l.qty)}</td><td>${fmt(l.price)}</td><td>${fmt(l.qty*l.price)}</td></tr>`).join('')}</tbody></table><h2 style="text-align:right">Totale ${fmt(x.total)}</h2><p style="margin-top:45px;font-size:10pt">DOCUMENTO DIMOSTRATIVO — NON FISCALE</p>`;window.print()}
render();
</script></body></html>
